[package]
name = "cuttl-wasm"
description = "wasm-bindgen shim over cuttl-codec: the skin renders pulses, the eye reads camera frames. No optics or channel simulation — that stays native."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cuttl-codec = { workspace = true }
wasm-bindgen = "0.2"
