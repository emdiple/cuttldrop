[workspace]
resolver = "3"
members = [
    "crates/cuttl-codec",
    "crates/cuttl-wasm",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
cuttl-codec = { path = "crates/cuttl-codec" }

raptorq = "2.0"    # outer fountain layer, RFC 6330 (DESIGN.md §1a)
blake3 = "1.8"     # whole-object integrity (DESIGN.md §3c)
crc32fast = "1.5"  # per-packet error->erasure gate (DESIGN.md §1b)
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1

# RaptorQ's intermediate-symbol solve is real linear algebra; unoptimised
# code makes the round-trip tests needlessly slow.
[profile.test]
opt-level = 2

[profile.test.package."*"]
opt-level = 2
