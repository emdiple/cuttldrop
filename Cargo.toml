[workspace]
resolver = "3"
members = [
    "crates/cuttl-codec",
    "crates/cuttl-sim",
    "crates/cuttl-cli",
    "crates/cuttl-wasm",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
cuttl-codec = { path = "crates/cuttl-codec" }
cuttl-sim = { path = "crates/cuttl-sim" }

raptorq = "2.0"    # outer fountain layer, RFC 6330 (DESIGN.md §1a)
blake3 = "1.8"     # whole-object integrity (DESIGN.md §3c)
crc32fast = "1.5"  # per-symbol error->erasure gate (DESIGN.md §1b)
thiserror = "2"

# Inner RS layer (DESIGN.md §1b): GF(2^8), 255-byte blocks, byte symbols, no_std.
# Explicitly NOT reed-solomon-32 -- despite the name that crate works in GF(2^5)
# with 31-symbol, 5-bit blocks, so it would mean repacking every byte and running
# ~90 blocks for one colour pulse. This is the GF(2^8) original it was forked from.
reed-solomon = "0.2"

image = { version = "0.25", default-features = false, features = ["png"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[profile.release]
lto = "thin"
codegen-units = 1

# The simulator is the M0 deliverable and runs thousands of frames per test.
# Unoptimised code makes `cargo test` unusably slow — and that applies to our
# own crates too, now that the channel does per-pixel blur and noise.
[profile.test]
opt-level = 2

[profile.test.package."*"]
opt-level = 2
