name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt / clippy / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets

      # The simulator is the primary test surface from M0 onward (DESIGN.md §5):
      # thousands of synthetic frames per run, no browser and no camera needed.
      # From M2 this also replays the recorded capture corpus.
      - run: cargo test --workspace

      # The codec must stay free of native-only dependencies: the browser runs
      # this exact code (DESIGN.md §4). Catching a stray `std::fs` or an image
      # crate here is far cheaper than discovering it during a browser build.
      - name: Codec builds for the browser
        run: cargo build -p cuttl-codec -p cuttl-wasm --target wasm32-unknown-unknown

  web:
    name: web build + JS boundary test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: jetli/wasm-pack-action@v0.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      # Exercises the wasm-bindgen glue with no browser: that `pulseRgba` is
      # RGBA at grid size, that `ingest` takes what `ImageData.data` gives it,
      # and that a file survives the round trip through the JS API.
      - run: npm test
        working-directory: web

      - run: npm run build
        working-directory: web
